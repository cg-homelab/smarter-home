[workspace]
resolver = "2"
members = [
  "src/lib/lib-models",
  "src/lib/lib-utils",
  "src/lib/lib-db",
  "src/services/api",
  # "src/services/desktop/src-tauri",
]

[workspace.dependencies]
tokio = { version = "^1", features = ["full"] }
features = "^0.10"
tracing = "^0.1"
tracing-subscriber = { version = "^0.3", features = ["env-filter"] }
uuid = { version = "^1", features = ["v4", "serde"] }
chrono = { version = "^0.4", features = ["serde"] }
serde = { version = "^1.0", features = ["derive"] }
axum = { version = "^0.8", features = ["ws", "multipart", "macros"] }
axum-extra = { version = "^0.12", features = ["typed-header"] }
# surrealdb = "2.3.10"
serde_json = "^1.0"
jsonwebtoken = { version = "^10.4", default-features = false, features = [
  "rust_crypto",
] }
sqlx = { version = "^0.9", features = [
  "runtime-tokio",
  "postgres",
  "uuid",
  "json",
  "chrono",
  "tls-rustls",
] }
utoipa = { version = "^5.4", features = ["uuid", "chrono"] }
thiserror = "^2.0"
anyhow = "^1"
once_cell = "^1.21"
sha2 = "^0.10"

[profile.release]
# Symbols are stripped from the shipped binary; no build-time cost. LTO and
# codegen-units = 1 are deliberately omitted, since both trade build time for
# runtime speed and this workspace optimises for build time.
strip = "symbols"

[profile.dev]
# Enough debug info for backtraces without the full debuginfo build cost.
debug = "line-tables-only"
