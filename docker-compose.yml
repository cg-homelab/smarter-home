services:
  # Backend Application
  backend:
    container_name: backend
    build:
      context: ./
      dockerfile: Dockerfile.api
      #target: prod
    restart: unless-stopped
    ports:
      - ${BACKEND_PORT}:${BACKEND_PORT}
    environment:
      DATABASE_URL: postgresql://${DB_USERNAME}:${DB_PASSWORD}@sm-db:${DB_PORT}/${DB_NAME}
      BACKEND_PORT: ${BACKEND_PORT}
      FRONTEND_PORT: ${FRONTEND_PORT}
      AUTH_SECRET: ${AUTH_SECRET}
      LOG_LEVEL: debug
    depends_on:
      database:
        condition: service_healthy
    networks:
      - smarter_home

  # Webapp (Next.js)
  webapp:
    container_name: webapp
    build:
      context: ./
      dockerfile: Dockerfile.webapp
    restart: unless-stopped
    ports:
      - ${FRONTEND_PORT}:3000
    environment:
      - API_URL=http://backend:${BACKEND_PORT}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - smarter_home

  # Database
  database:
    container_name: sm-db
    # Pinned by digest: an upstream retag of :pg17 could move PGDATA again and
    # silently orphan the volume mounted below.
    image: timescale/timescaledb-ha:pg17@sha256:8cfcb83ee65178270a7b4f1eaf4af0854fa1639ed21c3202fb669707913faed9
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      # The timescaledb-ha image sets PGDATA=/home/postgres/pgdata/data, NOT the
      # standard /var/lib/postgresql/data. Mounting the standard path silently
      # leaves the cluster in the container's writable layer, where it is lost on
      # container recreation. Do not "correct" this back.
      - smarter_home_database_volume:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "sh -c 'pg_isready -U ${DB_USERNAME} -d ${DB_NAME}'"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - smarter_home

volumes:
  smarter_home_database_volume:
networks:
  smarter_home:
